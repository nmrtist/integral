# Project-wide clippy configuration.
# Allow the short, conventional mathematical identifiers used throughout the
# integral code (l, m, n angular momenta; a, b centers; p, q exponents; T, F_m).
# Without this, clippy's `min_ident_chars`/similar would fight standard
# quantum-chemistry notation. We keep this list intentionally small.
allowed-idents-below-min-chars = ["..", "i", "j", "k", "l", "m", "n", "p", "q", "s", "t", "x", "y", "z", "a", "b", "c", "d", "r"]
