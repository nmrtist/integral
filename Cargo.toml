[workspace]
resolver = "2"
members = [
    "crates/integral",
    "crates/integral-sys",
    "crates/integral-codegen",
    "benches",
    "xtask",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
rust-version = "1.82"
repository = "https://github.com/nmrtist/integral"
homepage = "https://github.com/nmrtist/integral"
authors = ["integral contributors"]
keywords = ["quantum-chemistry", "gaussian", "integrals", "molecular", "eri"]
categories = ["science", "mathematics"]

[workspace.dependencies]
integral = { path = "crates/integral", version = "0.4.1" }
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
doc_markdown = "allow"

# Keep test builds optimized while preserving debug assertions.
[profile.test]
opt-level = 2

[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
debug = false
